services:

  # Ollama — 모델 실행 엔진
  ollama:
    image: ollama/ollama:latest
    container_name: freshguard-ollama
    volumes:
      - ollama_data:/root/.ollama
    # 포트를 외부에 노출하지 않음 — vlm-server만 내부 네트워크로 접근
    expose:
      - "11434"
    restart: unless-stopped
    # NVIDIA GPU 사용 시 아래 주석 해제
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # FreshGuard VLM Server — FastAPI
  vlm-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: freshguard-vlm
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # 컨테이너 내부에서 ollama 서비스로 연결
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama_data:
